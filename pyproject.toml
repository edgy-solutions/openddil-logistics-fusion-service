[project]
name = "openddil-logistics-fusion-service"
version = "0.1.0"
description = "Per-asset logistics fusion — windowed telemetry + CM state -> AssetLogisticsStatus"
requires-python = ">=3.11"
dependencies = [
    # Restate Virtual Object for per-asset workflow (Track B5 — registered
    # in dependency graph now so the package is installable end-to-end at
    # checkpoint time even though the workflow itself isn't built yet).
    "restate-sdk>=0.18.0,<1.0.0",
    "hypercorn>=0.17.0,<1.0.0",
    "confluent-kafka>=2.0.0,<3.0.0",
    # Gencode in openddil-contracts/gen/python was generated by
    # grpcio-tools 6.31.1; runtime must match.
    "protobuf>=6.30.0,<7.0.0",
    # Fusion rules use pint for unit-safe math at thresholds.
    "pint>=0.23,<1.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.20.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fusion*", "workflows*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "--cov=fusion --cov-report=term-missing"
